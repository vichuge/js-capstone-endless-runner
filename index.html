<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sunny Land: an endless runner where a cute fox jumps between platforms, collects gems and avoids frogs." />
    <meta name="theme-color" content="#1d1a2f" />
    <title>Sunny Land</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <main id="game"></main>

    <!-- "Pick your name" modal, driven from src/nameModal.js -->
    <div
      class="modal fade"
      id="nameModal"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="nameModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" id="nameForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="nameModalLabel">Pick your name</h5>
          </div>
          <div class="modal-body">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" name="name" id="name" maxlength="12" autocomplete="nickname" />
            <p class="error" id="error" role="alert"></p>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary" id="modalContinue">Continue</button>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="main.js"></script>
  </body>
</html>

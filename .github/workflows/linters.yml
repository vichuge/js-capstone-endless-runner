name: CI

on:
  pull_request:
  push:
    branches: [development]

env:
  FORCE_COLOR: 1

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + Stylelint)
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
